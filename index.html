<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Informe diario de equipos</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#d31f16" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1b1b" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Informes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="splash" role="status" aria-label="Cargando"><picture><source media="(prefers-color-scheme: dark)" srcset="icons/logo-dark.png"><img src="icons/logo.png" alt="WheelCo"></picture><div class="sbar"><i></i></div><p>Cargando…</p></div>
<header id="top"></header>
<div class="wrap" id="app"></div>
<div id="toast" role="status" hidden></div>
<noscript>Esta aplicación necesita JavaScript.</noscript>
<script src="config.js"></script>
<script src="app.js"></script>
<script>setTimeout(function(){var s=document.getElementById("splash");if(s)s.classList.add("off")},12000)</script>
</body>
</html>
